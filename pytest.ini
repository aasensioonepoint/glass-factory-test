# pytest configuration for the agentic-builder-kit scaffolding repo.
#
# Deliberately minimal, et cette configuration reste ICI, jamais dans
# `pyproject.toml` : deux sources de scope se contrediraient en silence, et
# c'est ce fichier qui fait autorite — `core-scripts/verify.sh` lance pytest par
# `core-scripts/run-pytest-shards.sh`, qui COLLECTE avec ce scope puis joue des
# tranches en parallele (`CADRE_GATE_JOBS=1` = `python -m pytest -q` nu, forme de la CI).
#
# PORTÉE (T-00001183) : ce qui précède vaut en mode KIT. Dans un projet ADOPTANT
# (`.agents/IS_THE_KIT` absent ET `.agents/security/module_discovery.py` présent),
# `verify.sh` ne lance plus `run-pytest-shards.sh` et la CI saute le job `tests` :
# la porte est `.agents/bin/porte_adoptant.py`, qui joue CHAQUE module python par
# `pytest -c <config> --rootdir <module> --confcutdir <module>`, `<config>` étant
# la config PROPRE du module (précédence de pytest à 7 rangs, bornée à son
# dossier) ou un ini généré. Le `pytest.ini` de la RACINE de l'adoptant — celui-ci
# ou celui que `rendre_pytest_ini` a rendu — n'est donc PAS le périmètre de la
# porte : au module racine il n'est jamais pris pour la config du projet, et
# chaque appel porte son `-c`. Sans `-c`, pytest le préférerait au
# `pyproject.toml` de la racine (rang 3 contre 5) et ses `testpaths` et
# `python_files` décideraient de la collecte. Témoins : C1a, C1b et C1g de
# `.agents/bin/test_porte_adoptant.py`.
#
# CE COMMENTAIRE DISAIT L'INVERSE JUSQU'AU 2026-09-12, et il faut dire pourquoi
# plutot que de l'effacer. Il affirmait « this repo IS the product, it is NOT a
# Python package… no pyproject.toml here — introducing either would flip stack
# detection and trip the SCA gate ». La MESURE etait juste et le reste :
# `module_discovery.py` range `pyproject.toml` dans la famille `python`, donc le
# depot devient un module decouvert et la porte de dependances le scanne.
#
# C'est la CONCLUSION qui a change, par la refonte T-012 : le kit devient un
# produit INSTALLABLE, et sans manifeste il n'y a ni wheel, ni entry point, ni
# installation. Le manifeste existe donc, avec une table `dependencies` VIDE que
# `test_cadre_package.py` refuse de laisser se remplir — un scan de dependances
# sur un manifeste sans dependance ne peut rien trouver.
#
# pytest reste la seule dependance d'execution des BANCS, installee directement
# en CI (voir .github/workflows/ci.yml). Le NOYAU, lui, est stdlib seule.
#
# rootdir is pinned to this file's directory (repo root) so the test suites,
# which resolve paths relative to the repo, work identically on Windows dev
# boxes and the ubuntu-latest CI runner.
[pytest]
testpaths =
    .agents
    .agents/evals
    .codex
    .gemini
    .agents/vendor/agentic_v3
python_files = test_*.py

# Marqueurs DÉCLARÉS — un marqueur inconnu n'est qu'un avertissement aujourd'hui,
# et devient une ERREUR le jour où quelqu'un pose `filterwarnings = error`.
#
# `markers` EST UNE LINELIST, et c'est la faute que ce bloc a commise avant d'être
# corrigé : pytest coupe sur les RETOURS À LA LIGNE et prend ce qui précède le
# premier « : » comme NOM. Une description étalée sur sept lignes déclarait donc
# SEPT marqueurs, dont six absurdes — mesuré par `pytest --markers`, qui rendait
# `@pytest.mark.greffe de banc. Nécessaire parce que…`. Le registre que
# `--strict-markers` consulte se trouvait pollué de six noms inventés, et le
# commentaire d'origine — « le déclarer coûte une ligne » — était démenti par sa
# propre implémentation. LA DESCRIPTION TIENT SUR UNE SEULE LIGNE ; le motif vit
# ici, en commentaire, où rien ne le découpe.
#
# `email_git_reel` : la fixture `autouse` de `test_board_bridge.py` greffe
# `_email_git` au niveau MODULE, donc AVANT toute fixture de classe — une variable
# d'environnement posée dans le corps du test arriverait après elle. Le marqueur,
# lui, se lit par `request` quel que soit l'ordre. C'est ce canal, et lui seul,
# qui aurait rougi sur la régression de `git config` rendant `rc=1` sur une clé
# absente (T-00000695).
markers =
    email_git_reel: le témoin exerce le VRAI `git config user.email` au lieu de la greffe de banc.
python_classes = *Tests Test*
python_functions = test_*
