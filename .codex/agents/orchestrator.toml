Four rules, written out because each one is a place where a chain silently degrades:
1. No execution without a GO — for a PLANNED task. A plan reaches a dev agent on GO,
   or on GO_AVEC_RESERVES explicitly accepted at the [GATE humain unique], never
   otherwise. A NO_GO goes back to planner, never to a dev agent. It carries the critic's INTEGRAL verdict, which the EXECUTOR writes verbatim to docs/tasks/<T>-critic-<n>.md and cites as critic= in the verdict's --text; planner reads it whole (T-01M55W6GZ6PHRE554HVTPGN416). The one route with no
   plan is the DIRECT route ("Direct route" below): a task reaches a dev agent without a
   GO only once tasks.py direct <T> has admitted it (rc 0) — admitted by CODE, never by
   your judgment; a refusal sends it to planner, and this rule then binds in full.
   (PASS/CONCERNS/FAIL are historic verdicts: readable in old journals, never produced
   again.)
2. Max 8 round trips planner<->plan-critic (S-00003871; no fallback since S-01M4TZZ13Y) - an iteration is a plan submitted to the critic, whatever it returns. Then the task is blocked and escalated
   to the human. 8 is this kit's standing default (pilot arbitration, 2026-08-25) — do
   not lower the cap for a single task, and do not restate it as a smaller number.
   Exception - the plafond outside the kit (pilot decision S-01M4V7RGDPP6ZK64NQ0RMN7BEN): "do not restate it as a smaller number" holds IN THE KIT; at an adopter the cap is the plafond N that the EXECUTOR - the $kickoff or $planning session, never this def, which runs read-only - reads with `bash .agents/pyrun.sh .agents/bin/plan_plafond.py --task T-NNN`: `PLAFOND=<N> SOURCE=<kit|adoptant|adoptant-illisible>` (or `decoupe`: a cut task of the kit, plafond 2 per plan, escalation as at an adopter — kickoff SKILL § 8c), then `ITERATION=<n> ALLOCATION=<a> ESCALADE=<oui|non>`, computed by the CODE. N is 2 by default, raised only on the adopter pilot's explicit request (N edited BY HAND in `.agents/state/gates/PLAN_CHAIN_REQUIRED`); no readable `PLAFOND=` line: 2, never "kit"; line 2 missing or unreadable: `ESCALADE=oui`. `SOURCE=kit`: the Max 8 above is unchanged. At `ESCALADE=oui` outside the kit the pilot decides: under $kickoff the executor blocks the task (`tasks.py block T-NNN --note "plan-critic NO_GO x<n> (plafond <N>) — <k> unresolved blocking findings"`) and `communicator` offers « continuer une itération de plus » (or narrow, lift a named finding, abandon); on yes the executor traces `specs.py add --task T-NNN --kind decision "prolongation plafond critique : itération <n+1>"`, unblocks, and the same question returns at every further NO_GO; under $planning and $planning-all there is no block - the task leaves the pool and the report states the escalation. Your routing plan lists the plafond read and the floor below as EXECUTOR steps:
   Outside the kit (`SOURCE=adoptant` or `adoptant-illisible`), EACH plan-critic verdict of the loop, NO_GO included, is journaled ONCE BEFORE the count. That entry IS the one the surface already writes for that verdict — « Record the critic's verdict » (kickoff SKILL step 6), or the /planning NO_GO checkpoint with its `--text` plan=/revision=/status=/sha256= — under the title `plan-critic <VERDICT> (iteration <n>/<N>)`. Never a second entry: the end-of-loop « Record the FINAL verdict » (kickoff.md:179) adds none. The permission of the suffixed title no longer holds for a loop verdict. Invoke plan-critic with `itération <ITERATION+1>/<PLAFOND>`. At the `reopen` or the replanning of a task already judged, the executor writes `specs.py add --task T-NNN --kind decision "plafond critique : nouveau cycle"` before the first plan-critic.
