Gated chain. The pipeline above is one chain with two adversarial gates and a
single human one. Route it in this shape, never a shorter one:

```text
planner → plan-critic (PLAN, critique UNIQUE, son verdict EST le verdict ; indisponible : COVERAGE DEGRADED, verdict absent)
                             ──NO_GO──> planner reprend son plan avec les constats du critique (S-01M4TZZ13Y)
                             (max 8 itérations de critique, puis escalade humaine)
              │ GO / GO_AVEC_RESERVES
              ▼  [GATE humain unique]
   dev(-mono | -multi | frontend-fidelity | terraform-deployer)
              │
              ▼
   exec-critic (EXÉCUTION) ∥ securite, même diff ; NO_GO/findings ──> dev, qui relance les deux
   securite = security-code-review  (code produit — class-1, jamais waivable)
            + security-orchestrator (si un manifeste de dépendances a bougé)
              │  RÉGIME EN VIGUEUR AUJOURD'HUI : systématique, les deux, jamais contourné
              │  RÉGIME CIBLE À PARTIR DE P5 : ──findings sensibles──> securite (règle 3)
              │  class-0 gitleaks : actif dans les deux régimes (règle 4)
              │ GO
              ▼
   build_index --if-stale (0-LLM) → documenter
     → indexer? → revue critic-opus (repli fable, puis sonnet-max) → corrections
     → porte verify.sh --at HEAD → tasks.py done → livraison
                                          │
                                          └── LECON_CANDIDATE → retro/LESSONS.md
```

The documenter at the tail of this chain runs AFTER a dev agent: hand it the dev
agent's diff summary as its "Dev agent's diff summary (if post-change)" input —
without it the documenter treats the call as the docs-only route and refuses
source-file writes (docstrings, inline comments).

CLOSING REVIEW — NO TASK IS MARKED DONE WITHOUT A CRITICAL REVIEW
(AGENTS.md, Golden rules). Steps 11-13 are the chain's last links, in THIS order:
work → review → FIX its findings → gate bash core-scripts/verify.sh --at HEAD →
tasks.py done T-NNN --raison "<why>" (--at HEAD alone is this kit repo's local
waiver, AGENTS.md, Verifying before a push; --at HEAD in an adopter, whose gate is
porte_adoptant.py (project and submodules) and where --linux has no object; never
the bare form: it stamps mode=live, refused at push and invisible to the borrow
window) — the review precedes the gate, and done comes only after both; a gate that
went green BEFORE the review proves nothing about the closure. FIX means: route the
findings to the task's dev-* agent (fix pass: kind=delta, replay
security-code-review on the fix diff; documenter only if the fix touched what it
documented; the review is not re-run — a borrowed proof's done records the reviewed
SHA on the board, `[binôme relevé sur T-… @ <sha>]`, and a task closed on its own
trace cites that SHA in --raison, so the reader sees the corrections came after).
